name: Deploy to Cloudflare Pages

# Builds the site and deploys it, with the functions/ folder, to the existing
# Direct Upload Pages project "srikanthtallapaneni" (srikanthtallapaneni.pages.dev).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 4 reads wrangler.jsonc (the D1 database binding); the action's default 3.90 ignores it
          wranglerVersion: "4.48.0"
          command: pages deploy build --project-name=srikanthtallapaneni --branch=main
